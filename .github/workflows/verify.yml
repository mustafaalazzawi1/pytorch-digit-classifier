name: Verify classifier
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install "$(sed -n '/^torch==/p' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Check inputs, exports, and recorded results
        run: |
          python -m unittest discover -s tests -v
          python -O verify_artifacts.py
          node tests/browser-parity.mjs
      - name: Reproduce the fixed training run
        run: |
          python train.py --output runs/ci
          python verify_artifacts.py --artifacts runs/ci
          python -c "import json; a=json.load(open('artifacts/metrics.json')); b=json.load(open('runs/ci/metrics.json')); assert a['selected_epoch']==b['selected_epoch']; assert a['mlp']['confusion_matrix']==b['mlp']['confusion_matrix']; print('Fixed-seed predictions reproduced')"
